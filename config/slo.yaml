service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: "Hệ thống đặt mục tiêu 99.5% request hoàn thành thành công với latency <= 3000ms trong chu kỳ 28 ngày. Error budget khả dụng là 0.5%. Với lưu lượng ước tính 10,000 request/tháng, tối đa 50 request được phép thất bại hoặc vượt quá 3000ms. Baseline hệ thống đạt P95 latency ~200ms và error rate 0%, đảm bảo tuân thủ SLO nghiêm ngặt."
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
